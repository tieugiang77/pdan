<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo dàn 9x - 0x ngẫu nhiên</title>
    <link href="/" rel="canonical"><link rel="SHORTCUT ICON" href="js/favicon.ico" type="js/x-icon.ico">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #0ea5e9;
            --primary-hover: #0284c7;
            --accent-color: #f59e0b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* --- NAVBAR --- */
        .modern-navbar {
            background-color: var(--card-bg);
            display: flex;
            justify-content: center;
            padding: 15px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .tab-links {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 0;
            padding: 0;
            justify-content: center;
        }

        .tab-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
            padding: 10px 22px;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-block;
            letter-spacing: 0.3px;
        }

        .tab-links a:hover {
            background-color: #f1f5f9;
            color: var(--primary-color);
        }

        .tab-links a.active {
            background-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
        }

        .tab-links a.highlight {
            background-color: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
        }
        
        .tab-links a.highlight:hover {
            background-color: #d97706;
        }

        /* --- MAIN CONTENT --- */
        .main-wrapper {
            padding: 40px 15px;
            max-width: 900px;
            margin: 0 auto;
        }

        .modern-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid #f1f5f9;
        }

        /* --- CONTROLS --- */
        .control-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .control-label {
            font-weight: 700;
            font-size: 16px;
            margin: 0;
            color: var(--text-main);
        }

        .modern-input {
            width: 80px;
            height: 45px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-color);
            transition: all 0.2s;
        }

        .modern-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        .modern-btn {
            height: 45px;
            padding: 0 25px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-generate {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-generate:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(14, 165, 233, 0.3);
        }

        .btn-copy {
            background-color: #10b981;
            color: white;
        }

        .btn-copy:hover {
            background-color: #059669;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3);
        }

        /* --- TEXTAREA --- */
        .result-textarea {
            width: 100%;
            min-height: 500px;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            background-color: #f8fafc;
            font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
            font-size: 15px;
            line-height: 1.6;
            color: #334155;
            resize: vertical;
            transition: border-color 0.2s;
        }

        .result-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #ffffff;
        }
        
       /* Custom Scrollbar cho Textarea */
        .result-textarea::-webkit-scrollbar {
            width: 20px; 
        }
        .result-textarea::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 10px;
        }
        .result-textarea::-webkit-scrollbar-thumb {
            background: #e11d48; 
            border-radius: 10px;
            border: 2px solid #f1f5f9; 
        }
        .result-textarea::-webkit-scrollbar-thumb:hover {
            background: #be123c; 
        }
    </style>
</head>
<body>

    <nav class="modern-navbar">
        <ul class="tab-links">
            <li><a href="index.html" class="active">HOME</a></li>
            <li><a href="3d.html" class="highlight">Tạo 3D-4D</a></li>            
            <li><a href="radom.html" class="active">09xRandom</a></li>            
            <li><a href="chao.html" class="highlight">TÍNH CHÃO</a></li> 
        </ul>
    </nav>

    <div class="main-wrapper">
        
        <div class="modern-card">
            <div class="control-group">
                <label for="soluongdan" class="control-label">NHẬP SỐ LƯỢNG DÀN :</label>
                <input type="number" id="soluongdan" class="modern-input" value="1" min="1">
                <button class="modern-btn btn-generate" onclick="taonhieudan();">
                    <svg style="width:20px;height:20px;margin-right:8px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                    Tạo dàn
                </button>
                <button class="modern-btn btn-copy" onclick="myFunction();">
                    <svg style="width:20px;height:20px;margin-right:8px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    Copy
                </button>   
            </div>
        </div>

        <div class="modern-card">
            <textarea id="ketqua" class="result-textarea" placeholder="Kết quả sẽ hiển thị ở đây..." readonly></textarea>
        </div>

    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script type="text/javascript">
        function taonhieudan() {
            var n = document.getElementById('soluongdan').value;
            var txt = "";
            for (var i = 0; i < n; i++) {
                var a = taodan();
                txt +=  a + '\n' + '=================================' + '\n\n';
            }
            document.getElementById('ketqua').value = txt;
        }

        function taodan() {
            var dan = random();
            var xuatketqua = "";
            xuatketqua += '9 5 s\n' + dan.arr95 + '\n\n'  
                        + '8 8 s\n' + dan.arr88 + '\n\n'  
                        + '7 8 s\n' + dan.arr78 + '\n\n' 
                        + '6 8 s\n' + dan.arr68 + '\n\n'  
                        + '5 8 s\n' + dan.arr58 + '\n\n' 
                        + '4 8 s\n' + dan.arr48 + '\n\n'  
                        + '3 8 s\n' + dan.arr38 + '\n\n'  
                        + '2 8 s\n' + dan.arr28 + '\n\n'  
                        + '1 8 s\n' + dan.arr18 + '\n\n'  
                        + '0 8 s\n' + dan.arr8;
            return xuatketqua;
        }

        function myFunction() {
            var copyText = document.getElementById("ketqua");
            if (copyText.value === "") {
                alert("Chưa có dữ liệu để copy!");
                return;
            }
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            document.execCommand("copy");
			
            var copyBtn = document.querySelector('.btn-copy');
            var originalHTML = copyBtn.innerHTML;
            copyBtn.innerHTML = '<svg style="width:20px;height:20px;margin-right:8px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Đã Copy!';
            setTimeout(function() {
                copyBtn.innerHTML = originalHTML;
            }, 2000);
        }

        function random() {
            var arr1 = [1,2,3,4,6,7,8,9,10,12,13,14,15,17,18,19,20,21,23,24,25,26,28,29,30,31,32,34,35,36,37,39,40,41,42,43,45,46,47,48,51,52,53,54,56,57,58,59,60,62,63,64,65,67,68,69,70,71,73,74,75,76,78,79,80,81,82,84,85,86,87,89,90,91,92,93,95,96,97,98];
            var arr2 = [0,5,11,16,22,27,33,38,44,49,50,55,61,66,72,77,83,88,94,99];
            
            arr1.sort(function(a, b){return 0.5 - Math.random()});
            arr2.sort(function(a, b){return 0.5 - Math.random()});

            arr1.splice(0, 5); var arr95 = arr1.concat(arr2);
            arr1.splice(0, 7); var arr88 = arr1.concat(arr2);
            arr1.splice(0, 10); var arr78 = arr1.concat(arr2);
            arr1.splice(0, 6); arr2.splice(0, 4); var arr68 = arr1.concat(arr2);
            arr1.splice(0, 6); arr2.splice(0, 4); var arr58 = arr1.concat(arr2);
            arr1.splice(0, 6); arr2.splice(0, 4); var arr48 = arr1.concat(arr2);
            arr1.splice(0, 6); arr2.splice(0, 4); var arr38 = arr1.concat(arr2);
            arr1.splice(0, 6); arr2.splice(0, 4); var arr28 = arr1.concat(arr2);
            arr1.splice(0, 10); var arr18 = arr1.concat(arr2);
            arr1.splice(0, 10); var arr8 = arr1.concat(arr2);

            var allArrays = [arr95, arr88, arr78, arr68, arr58, arr48, arr38, arr28, arr18, arr8];
            allArrays.forEach(arr => arr.sort(function(a, b){return a - b}));

            allArrays.forEach(arr => {
                for (var i = 0; i < arr.length; i++) {
                    if (arr[i] < 10) arr[i] = "0" + arr[i];
                }
            });
            
            return { arr95, arr88, arr78, arr68, arr58, arr48, arr38, arr28, arr18, arr8 };
        }
    </script>
</body>
</html>
